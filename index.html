<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Afnan, will you be my girlfriend? 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink-bg: #fde8ea;
    --card-bg: #fff5f6;
    --accent: #c8325a;
    --accent-light: #e05a7a;
    --text-dark: #3a1a24;
    --text-mid: #7a4a58;
    --heart: #e0325a;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--pink-bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Floating background hearts */
  .bg-heart {
    position: fixed;
    font-size: 1.2rem;
    opacity: 0.18;
    animation: floatUp linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(0deg); opacity: 0.18; }
    100% { transform: translateY(-10vh) rotate(30deg); opacity: 0; }
  }

  /* ── MAIN CARD ── */
  .card {
    position: relative;
    z-index: 10;
    background: var(--card-bg);
    border-radius: 28px;
    box-shadow: 0 8px 40px rgba(200,50,90,0.13), 0 2px 8px rgba(200,50,90,0.07);
    padding: 44px 48px 36px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    animation: popIn 0.55s cubic-bezier(.4,1.6,.6,1) both;
  }
  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  /* Cat emoji */
  .cat-wrap {
    font-size: 4rem;
    line-height: 1;
    margin-bottom: 6px;
    animation: wiggle 2.4s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes wiggle {
    0%,100% { transform: rotate(-4deg) scale(1); }
    50%      { transform: rotate(4deg) scale(1.06); }
  }

  h1 {
    font-size: 1.45rem;
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.35;
    margin: 18px 0 28px;
  }

  /* Button row */
  .btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    min-height: 60px;
  }

  .btn-yes {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 34px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(200,50,90,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    animation: pulse 2s ease-in-out infinite;
  }
  .btn-yes:hover {
    transform: scale(1.07);
    box-shadow: 0 6px 24px rgba(200,50,90,0.45);
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 4px 16px rgba(200,50,90,0.35); }
    50%      { box-shadow: 0 4px 28px rgba(200,50,90,0.55); }
  }

  .btn-no {
    background: #fff0f2;
    color: var(--text-mid);
    border: 2px solid #f0c0cc;
    border-radius: 50px;
    padding: 10px 22px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s;
    position: absolute; /* will be repositioned by JS */
  }

  .hint-text {
    margin-top: 14px;
    font-size: 0.83rem;
    color: var(--accent);
    font-style: italic;
    font-weight: 600;
    min-height: 20px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hint-text.show { opacity: 1; }

  /* ── YES PAGE ── */
  #yes-page {
    display: none;
    position: relative;
    z-index: 10;
    background: var(--card-bg);
    border-radius: 28px;
    box-shadow: 0 8px 40px rgba(200,50,90,0.13);
    padding: 44px 48px 36px;
    max-width: 440px;
    width: 90%;
    text-align: center;
    animation: popIn 0.55s cubic-bezier(.4,1.6,.6,1) both;
  }

  #yes-page h2 {
    font-size: 1.9rem;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 8px;
  }

  #yes-page p {
    font-size: 1rem;
    color: var(--text-mid);
    font-weight: 600;
    margin-bottom: 22px;
  }

  .yes-gif {
    width: 100%;
    max-width: 280px;
    border-radius: 16px;
    margin: 0 auto 24px;
    display: block;
    box-shadow: 0 4px 20px rgba(200,50,90,0.18);
  }

  /* Fallback cute illustration when gif not available */
  .yes-illustration {
    width: 280px;
    height: 180px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    background: linear-gradient(135deg, #ffe0e8, #ffd0de);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(200,50,90,0.18);
  }

  .yes-btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-share, .btn-link {
    border: none;
    border-radius: 50px;
    padding: 12px 24px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-share {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: #fff;
    box-shadow: 0 4px 16px rgba(200,50,90,0.3);
  }
  .btn-link {
    background: #fff;
    color: var(--accent);
    border: 2px solid var(--accent);
  }
  .btn-share:hover, .btn-link:hover {
    transform: scale(1.05);
  }

  /* Footer */
  footer {
    position: fixed;
    bottom: 14px;
    font-size: 0.73rem;
    color: #b07080;
    z-index: 20;
    text-align: center;
  }
  footer a { color: var(--accent); text-decoration: none; }

  /* Confetti canvas */
  #confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<!-- Main question card -->
<div class="card" id="main-card">
  <div class="cat-wrap">🐱💕</div>
  <h1>Afnan, will you be my<br>girlfriend?</h1>

  <div class="btn-row" id="btn-row" style="position:relative; min-height:70px;">
    <button class="btn-yes" id="btn-yes" onclick="sayYes()">Yes :*</button>
    <button class="btn-no"  id="btn-no"  style="position:relative;">No 🌟</button>
  </div>

  <p class="hint-text" id="hint-text">Haha, nice try! 🌿</p>
</div>

<!-- Yes celebration card -->
<div id="yes-page">
  <h2>Yayy! You said YES! 💝</h2>
  <p>Knew you'd say yes 😊</p>

  <div class="yes-illustration">🐾🤍🐾</div>

  <div style="font-size:1.1rem; margin-bottom:22px; font-weight:700; color:var(--text-dark);">
    You and me 🥰
  </div>

  
</div>


<script>
/* ── Floating background hearts ── */
const heartChars = ['💕','💗','💓','💖','🌸','✨'];
for (let i = 0; i < 14; i++) {
  const el = document.createElement('div');
  el.className = 'bg-heart';
  el.textContent = heartChars[i % heartChars.length];
  el.style.left = Math.random() * 100 + 'vw';
  el.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
  el.style.animationDuration = (7 + Math.random() * 10) + 's';
  el.style.animationDelay = (-Math.random() * 15) + 's';
  document.body.appendChild(el);
}

/* ── No button dodge ── */
const btnNo   = document.getElementById('btn-no');
const btnYes  = document.getElementById('btn-yes');
const hintEl  = document.getElementById('hint-text');
const btnRow  = document.getElementById('btn-row');

let noCount = 0;
const hints = [
  "Haha, nice try! 🌿",
  "It keeps running away… 🏃",
  "You can't catch it! 😂",
  "Tsk tsk tsk 🙈",
  "Just click YES already! 💘",
  "Nope, that won't work 😜",
  "The No button is scared 🐭",
];

function dodgeNo(e) {
  noCount++;

  // Grow yes button
  const newSize = Math.min(1 + noCount * 0.1, 2.5);
  btnYes.style.transform = `scale(${newSize})`;
  btnYes.style.fontSize = Math.min(1.05 + noCount * 0.07, 1.7) + 'rem';

  // Show hint
  hintEl.textContent = hints[Math.min(noCount - 1, hints.length - 1)];
  hintEl.classList.add('show');

  // Move No button to a random spot within the card
  const card = document.getElementById('main-card');
  const cw = card.offsetWidth - 100;
  const ch = card.offsetHeight - 60;
  const nx = Math.random() * cw - cw / 2 + 20;
  const ny = Math.random() * 60 - 30;

  btnNo.style.position = 'absolute';
  btnNo.style.left = `calc(50% + ${nx}px)`;
  btnNo.style.top  = `calc(60% + ${ny}px)`;
  btnNo.style.transform = 'translate(-50%, -50%)';
  btnNo.style.fontSize = Math.max(0.88 - noCount * 0.05, 0.5) + 'rem';
  btnNo.style.opacity  = Math.max(1 - noCount * 0.08, 0.2);
}

btnNo.addEventListener('mouseover', dodgeNo);
btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); dodgeNo(e); });
btnNo.addEventListener('click', dodgeNo);

/* ── Say Yes ── */
function sayYes() {
  document.getElementById('main-card').style.display = 'none';
  const yp = document.getElementById('yes-page');
  yp.style.display = 'block';
  launchConfetti();
}

/* ── Confetti ── */
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: -20,
    r: 4 + Math.random() * 7,
    d: 1 + Math.random() * 3,
    color: ['#e0325a','#f780a0','#ffb3c1','#ff6b9d','#c8325a','#ff97b7'][Math.floor(Math.random()*6)],
    tilt: Math.random() * 20 - 10,
    tiltSpeed: 0.1 + Math.random() * 0.2,
    tiltAngle: 0,
  }));

  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.tiltAngle += p.tiltSpeed;
      p.y += p.d;
      p.x += Math.sin(p.tiltAngle) * 2;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r, p.r * 0.45, p.tiltAngle, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.85;
      ctx.fill();
    });
    frame++;
    if (frame < 220) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

/* ── Share & Link ── */
function shareIt() {
  if (navigator.share) {
    navigator.share({ title: 'She said YES! 💕', text: 'Nirali said yes!! 💝', url: location.href });
  } else {
    navigator.clipboard.writeText(location.href).then(() => alert('Link copied! Share it 💕'));
  }
}
function makeLink() {
  alert('Coming soon! 💘 Make your own personalized link and ask your special someone!');
}
</script>
</body>
</html>
